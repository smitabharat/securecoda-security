version: '3.8'

services:
  backend:
    build: ./backend
    environment:
      CODA_API_TOKEN: ${CODA_API_TOKEN}
      DB_PATH: /data/securecoda.db
    ports:
      - "8080:8080"
    volumes:
      - data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API: http://localhost:8080/api

volumes:
  data:
